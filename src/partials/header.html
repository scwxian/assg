<header>
    <div class="top-navbar-content">
        <a href="%%BASE_URL%%/" id="logo">
            <img src="/assets/images/logo.png" alt="Logo">
        </a>

        <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false">
            <span class="sr-only">Menu</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                <title>Menu</title>
                <rect y="6" width="24" height="2" rx="1"></rect>
                <rect y="13" width="24" height="2" rx="1"></rect>
                <rect y="20" width="24" height="2" rx="1"></rect>
            </svg>
        </button>

        <div class="nav-links" data-visible="false">
            <nav id="primary-navigation">
                <button class="mobile-nav-close" aria-label="Close menu">&times;</button>
                <ul>
                    <li><a href="%%BASE_URL%%/about/">About</a></li>
                    <li><a href="%%BASE_URL%%/#services">Services</a></li>
                    <li class="nav-dropdown" data-dropdown-base="%%BASE_URL%%/dropdown">
                        <!-- Clickable variant: swap the button below for this anchor.
                             Desktop click then navigates; mobile click still toggles the menu.
                        <a href="%%BASE_URL%%/dropdown/" class="nav-dropdown-trigger" data-dropdown-trigger aria-haspopup="true" aria-expanded="false" aria-controls="dropdown-menu">Dropdown</a>
                        -->
                        <button
                            type="button"
                            class="nav-dropdown-trigger"
                            data-dropdown-trigger
                            aria-haspopup="true"
                            aria-expanded="false"
                            aria-controls="dropdown-menu"
                        >
                            Dropdown
                        </button>
                        <ul class="nav-dropdown-menu" id="dropdown-menu">
                            <li><a href="%%BASE_URL%%/link-1/">Link 1</a></li>
                            <li><a href="%%BASE_URL%%/link-2/">Link 2</a></li>
                            <li><a href="%%BASE_URL%%/link-3/">Link 3</a></li>
                        </ul>
                    </li>
                    <li><a href="%%BASE_URL%%/#contact">Contact</a></li>
                    <li><a class="nav-cta-button" href="https://example.com">Click Me</a></li>
                </ul>
            </nav>

            <div class="social-links-block">
                <p class="section-subtitle">Social Media</p>
                <div class="social-links">
                    <a href="%%INSTAGRAM%%" 
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Instagram">
                        <img src="https://placehold.co/20x20" alt="Instagram Icon">
                    </a>
                    <a href="https://wa.me/%%WHATSAPP%%" 
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="WhatsApp Us">
                        <img src="https://placehold.co/20x20" alt="WhatsApp Icon">
                    </a>
                </div>
            </div>

        </div>
    </div>
    <button id="scrollToTop" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
    </button>

    <div id="nav-backdrop" class="nav-backdrop"></div>
</header>
